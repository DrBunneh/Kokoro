name: Build Android APK

# Builds a sideloadable debug APK of InkForge LocalPlay on every push so the app
# can be installed and tested on-device (the build sandbox cannot produce APKs).
# Download the artifact from the run's "Artifacts" section, transfer to an
# Android device with "install unknown apps" enabled, and install.

on:
  push:
    branches: ["claude/spec-review-nwqtvg", "main"]
    paths:
      - "inkforge-localplay/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inkforge-localplay
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: inkforge-localplay/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: inkforge-localplay/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: inkforge-localplay-debug-apk
          path: inkforge-localplay/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # ---- OTA web-bundle release (consumed by the in-app Update button) ----
      - name: Package web bundle + manifest
        if: github.ref_name == 'claude/spec-review-nwqtvg'
        working-directory: inkforge-localplay
        run: |
          ( cd dist && zip -qr ../web-bundle.zip . )
          VER="$(git rev-parse --short HEAD)"
          MIN="$(cat ota/min-native-build.txt)"
          REPO="${{ github.repository }}"
          cat > latest.json <<EOF
          {
            "version": "${VER}",
            "url": "https://github.com/${REPO}/releases/download/web-latest/web-bundle.zip",
            "minNativeBuild": ${MIN},
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cp android/app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          echo "Built web bundle ${VER} (minNativeBuild ${MIN})"

      - name: Publish web-latest release
        if: github.ref_name == 'claude/spec-review-nwqtvg'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-latest
          name: Latest web bundle + APK
          body: "Rolling build. The in-app Update button pulls web-bundle.zip via latest.json; app-debug.apk is the installable native shell."
          files: |
            inkforge-localplay/web-bundle.zip
            inkforge-localplay/latest.json
            inkforge-localplay/app-debug.apk
